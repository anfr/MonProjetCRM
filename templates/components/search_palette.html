<div id="palette-recherche" x-data="{
     openPalette: false,
     searchQuery: '' ,
     results: [],
     isSearching: false,
     async chercher() {
     if (this.searchQuery.length>
    1) {
    this.isSearching = true;
    try {
    let response = await fetch('/api/recherche?q=' + encodeURIComponent(this.searchQuery));
    this.results = await response.json();
    } catch(err) {
    console.error('Erreur API Recherche:', err);
    } finally {
    this.isSearching = false;
    }
    } else {
    this.results = [];
    }
    }
    }"
    x-cloak
    @keydown.window.prevent.ctrl.k="openPalette = true; $nextTick(() => $refs.searchInput.focus())"
    @open-palette.window="openPalette = true; $nextTick(() => $refs.searchInput.focus())"
    class="relative z-[9999]">

    <div x-show="openPalette" x-transition.opacity class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" @click="openPalette = false"></div>

    <div x-show="openPalette" x-transition.scale.95 class="fixed inset-0 top-[10vh] mx-auto max-w-2xl w-full px-4 h-fit">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden" @click.outside="openPalette = false">
            <div class="flex items-center p-4 border-b border-slate-100 bg-slate-50/50">
                <i class="ph-bold ph-magnifying-glass text-2xl text-indigo-500 mr-3" x-show="!isSearching"></i>
                <i class="ph-bold ph-spinner animate-spin text-2xl text-indigo-500 mr-3" x-show="isSearching" style="display: none;"></i>
                <input x-ref="searchInput" x-model="searchQuery" @input.debounce.400ms="chercher()" class="w-full text-xl font-medium outline-none placeholder:text-slate-400 bg-transparent" placeholder="Rechercher un client, un tél ou un contrat...">
                <button @click="openPalette = false" class="p-2 text-slate-400 hover:text-slate-600">
                    <kbd class="text-[10px] font-bold border border-slate-200 px-2 py-1 rounded bg-white uppercase shadow-sm">Esc</kbd>
                </button>
            </div>
            <div class="max-h-[60vh] overflow-y-auto p-2 bg-white">
                <template x-for="res in results" :key="res.url">
                    <a :href="res.url" class="flex items-center justify-between p-4 hover:bg-indigo-50 rounded-2xl transition-all group border border-transparent hover:border-indigo-100 mb-1">
                        <div class="flex items-center gap-4">
                            <div class="p-2.5 bg-indigo-50 text-indigo-500 border border-indigo-100 rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                <i class="ph-bold text-xl" :class="res.icone"></i>
                            </div>
                            <div>
                                <span x-text="res.titre" class="block font-black text-slate-800 text-sm"></span>
                                <span x-text="res.sous_titre" class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5"></span>
                            </div>
                        </div>
                        <i class="ph-bold ph-caret-right text-slate-300 group-hover:text-indigo-500 text-lg"></i>
                    </a>
                </template>
                <div x-show="searchQuery.length > 1 && results.length === 0 && !isSearching" class="p-12 text-center text-slate-400 text-sm italic" style="display: none;">
                    Aucun résultat trouvé pour "<span x-text="searchQuery" class="font-bold text-slate-500"></span>"
                </div>
                <div x-show="searchQuery.length <= 1" class="p-12 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">
                    Tapez au moins 2 caractères
                </div>
            </div>
        </div>
    </div>
</div>

<div x-show="imgModal.open" x-transition.opacity class="fixed inset-0 z-[999999] bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4" @click="imgModal.open = false" x-cloak>
    <div class="relative max-w-5xl w-full max-h-[90vh] flex items-center justify-center" @click.stop>
        <button @click="imgModal.open = false" class="absolute -top-12 right-0 text-white hover:text-red-400 transition-colors">
            <i class="ph-bold ph-x text-3xl"></i>
        </button>
        <img :src="imgModal.src" class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain cursor-zoom-out" @click="imgModal.open = false">
    </div>
</div>
