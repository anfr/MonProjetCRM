{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto pb-12" x-data="{
    nom_kiosque: '{{ config.ticket_nom_kiosque | e }}',
    sous_titre: '{{ config.ticket_sous_titre | e }}',
    message: `{{ config.ticket_message | e }}`
}">

    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('parametres') }}" class="bg-white p-2 rounded-xl border border-slate-200 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-colors shadow-sm">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div>
            <h1 class="text-2xl font-black text-slate-800 flex items-center gap-3">
                <i class="ph-fill ph-receipt text-indigo-500 text-3xl"></i> Studio de Ticket Thermique
            </h1>
            <p class="text-sm text-slate-500 font-medium">Personnalisez le design de vos tickets d'attente.</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <div class="lg:col-span-7">
            <form action="{{ url_for('queue.admin_ticket') }}" method="POST" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-8 py-5 bg-slate-50 border-b border-slate-100">
                    <h3 class="font-bold text-slate-800">Éditeur de contenu</h3>
                </div>
                <div class="p-8 space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Nom de l'établissement (En-tête)</label>
                        <input type="text" name="ticket_nom_kiosque" x-model="nom_kiosque" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none font-bold uppercase" maxlength="25">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Sous-titre / Spécialité</label>
                        <input type="text" name="ticket_sous_titre" x-model="sous_titre" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="pt-4 border-t border-slate-100">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Message de fin (Pied de page)</label>
                        <textarea name="ticket_message" x-model="message" rows="4" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none"></textarea>
                        <p class="text-xs text-slate-400 mt-2">Ce texte s'affichera tout en bas du ticket, sous le numéro d'appel.</p>
                    </div>
                </div>
                <div class="px-8 py-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-black py-2.5 px-8 rounded-xl transition-all shadow-md">
                        SAUVEGARDER LE DESIGN
                    </button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-5 bg-slate-800 rounded-2xl shadow-inner border-4 border-slate-900 p-8 flex items-center justify-center relative overflow-hidden">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-2 bg-black rounded-b-xl shadow-[0_5px_15px_rgba(0,0,0,0.5)]"></div>

            <div class="bg-white w-[260px] shadow-2xl relative mt-4">

                <div class="px-5 py-6 text-center text-black font-mono flex flex-col" style="font-family: 'Courier New', Courier, monospace;">

                    <div class="border-b border-dashed border-slate-400 pb-3 mb-4">
                        <div class="text-xl font-bold uppercase leading-tight" x-text="nom_kiosque || '...'"></div>
                        <div class="text-[10px] mt-1 text-slate-700" x-text="sous_titre || '...'"></div>
                    </div>

                    <div class="mb-5">
                        <div class="text-sm font-bold uppercase">SERVICE EXEMPLE</div>
                        <div class="text-5xl font-black mt-2 leading-none tracking-tighter">#A042</div>
                    </div>

                    <div class="border-t border-dashed border-slate-400 pt-3 text-[11px] text-slate-800">
                        <div class="whitespace-pre-wrap leading-snug" x-text="message || '...'"></div>
                        <div class="text-[10px] mt-3 text-slate-500">Aujourd'hui à 14h30</div>
                    </div>
                </div>

                <div class="h-3 w-full bg-slate-800" style="mask-image: radial-gradient(circle at 4px 0px, transparent 4px, black 4px); mask-size: 8px 10px; mask-repeat: repeat-x; -webkit-mask-image: radial-gradient(circle at 4px 0px, transparent 4px, black 4px); -webkit-mask-size: 8px 10px; -webkit-mask-repeat: repeat-x;"></div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
