<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Kiosque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animations personnalisées pour le fond */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-sans">

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-4000"></div>

    <div class="relative z-10 text-center max-w-2xl mx-auto px-8 py-14 bg-white/70 backdrop-blur-xl rounded-[2.5rem] shadow-2xl border border-white/60">

        <div class="relative flex justify-center items-center mb-10">
            <h1 class="text-[120px] sm:text-[180px] font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-slate-200 to-slate-300 drop-shadow-sm select-none leading-none">
                404
            </h1>
            
            <div class="absolute inset-0 flex items-center justify-center mt-6">
                <div class="bg-gradient-to-tr from-indigo-500 to-blue-500 p-5 rounded-3xl shadow-[0_10px_40px_-10px_rgba(99,102,241,0.8)] transform -rotate-6 hover:rotate-0 transition-transform duration-300 ease-out">
                    <svg class="w-12 h-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9zm3.75 11.625a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                    </svg>
                </div>
            </div>
        </div>

        <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">
            Oups ! Reçu égaré...
        </h2>
        <p class="text-base sm:text-lg text-slate-500 mb-10 max-w-md mx-auto leading-relaxed font-medium">
            Cette page semble s'être perdue dans les archives du Kiosque. Retournons en lieu sûr avant que l'inspecteur n'arrive !
        </p>

        <a href="/" class="group relative inline-flex items-center justify-center px-8 py-4 text-base font-bold text-white transition-all duration-300 bg-indigo-600 rounded-2xl hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600 shadow-[0_8px_30px_rgb(79,70,229,0.25)] hover:shadow-[0_8px_30px_rgb(79,70,229,0.45)] hover:-translate-y-1">
            <svg class="w-5 h-5 mr-2.5 transform group-hover:-translate-x-1.5 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" />
            </svg>
            Retour au Tableau de bord
        </a>
        
    </div>

    <p class="absolute bottom-6 text-xs text-slate-400 font-medium text-center w-full">
        Ne vous inquiétez pas, aucun reçu n'a été maltraité pendant cette erreur.
    </p>

</body>
</html>
