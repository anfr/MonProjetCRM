<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CRM - Kiosque Multiservices</title>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @media print {
            aside, header, button, a, form {
                display: none !important;
            }

            main {
                padding: 0 !important;
                margin: 0 !important;
            }

            body {
                background-color: white !important;
            }

            table {
                page-break-inside: auto;
            }

            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        #tab-services {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body x-data="{ sidebarToggle: false }" class="bg-gray-50 text-gray-800 antialiased">

    <div class="flex h-screen overflow-hidden">

        <div x-show="sidebarToggle"
             @click="sidebarToggle = false"
             class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm transition-opacity lg:hidden"
             style="display: none;">
        </div>

        <aside :class="sidebarToggle ? 'translate-x-0' : '-translate-x-full'" class="absolute left-0 top-0 z-50 flex h-screen w-72 flex-col overflow-y-hidden bg-slate-900 duration-300 ease-linear lg:static lg:translate-x-0 shadow-2xl border-r border-slate-800">

            <div class="flex items-center justify-between gap-2 px-6 py-6 border-b border-slate-800/60">
                <a href="/" class="flex items-center gap-3 mt-2 group">
                    <div class="bg-blue-600 p-2 rounded-lg group-hover:bg-blue-500 transition-colors shadow-lg shadow-blue-900/20">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-white">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.809c0-.636-.28-1.236-.76-1.644l-6.6-5.614a3.375 3.375 0 00-4.43 0L3.14 8.165A2.625 2.625 0 002.36 9.81V21M15 6.75V4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75v2.25m-3 0h9" />
                        </svg>
                    </div>
                    <h1 class="text-white text-2xl font-black tracking-tight group-hover:text-blue-400 transition-colors">Mon CRM</h1>
                </a>
                <button @click="sidebarToggle = false" class="block lg:hidden text-slate-400 hover:text-white mt-2 p-1 focus:outline-none transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="no-scrollbar flex flex-col overflow-y-auto duration-300 ease-linear mt-4">
                <nav class="py-2 px-4 lg:px-5">
                    <p class="mb-3 px-4 text-xs font-bold uppercase tracking-wider text-slate-500">Menu Principal</p>
                    <ul class="mb-6 flex flex-col gap-1.5">

                        <li>
                            <a href="/" class="group relative flex items-center gap-3 rounded-lg py-2.5 px-4 font-medium text-slate-300 duration-200 ease-in-out hover:bg-slate-800 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-400 group-hover:text-blue-400 transition-colors">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                                </svg>
                                Tableau de bord
                            </a>
                        </li>

                        <li>
                            <a href="/clients" class="group relative flex items-center gap-3 rounded-lg py-2.5 px-4 font-medium text-slate-300 duration-200 ease-in-out hover:bg-slate-800 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-400 group-hover:text-blue-400 transition-colors">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                                </svg>
                                Mes Clients
                            </a>
                        </li>

                        <li>
                            <a href="/historique" class="group relative flex items-center gap-3 rounded-lg py-2.5 px-4 font-medium text-slate-300 duration-200 ease-in-out hover:bg-slate-800 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-400 group-hover:text-blue-400 transition-colors">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                </svg>
                                Historique & Comptes
                            </a>
                        </li>

                        <li class="mt-2">
                            <a href="/dettes" class="group relative flex items-center gap-3 rounded-lg py-2.5 px-4 font-medium text-red-400 duration-200 ease-in-out hover:bg-red-950/40 hover:text-red-300 border border-transparent hover:border-red-900/50">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-red-400 group-hover:text-red-300 transition-colors">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                                </svg>
                                Carnet de Crédit
                            </a>
                        </li>

                        {% if session.get('role') == 'admin' %}
                        <li class="mt-6">
                            <p class="mb-3 px-4 text-xs font-bold uppercase tracking-wider text-slate-500">Administration</p>
                            <a href="/parametres" class="group relative flex items-center gap-3 rounded-lg py-2.5 px-4 font-medium text-slate-300 duration-200 ease-in-out hover:bg-slate-800 hover:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-400 group-hover:text-gray-200 transition-colors">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                Paramètres
                            </a>
                        </li>
                        {% endif %}
                    </ul>
                </nav>
            </div>
        </aside>

        <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden bg-gray-50/50">

            <header class="sticky top-0 z-40 flex w-full bg-white border-b border-gray-200 shadow-sm shadow-gray-100/50">
                <div class="flex flex-grow items-center justify-between py-3 px-4 md:px-6">

                    <div class="flex items-center gap-2 lg:hidden">
                        <button class="flex items-center justify-center rounded-lg border border-gray-200 bg-white p-2 text-gray-600 shadow-sm hover:bg-gray-50 hover:text-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100" @click.stop="sidebarToggle = !sidebarToggle">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25H12" />
                            </svg>
                        </button>
                    </div>

                    <div class="hidden sm:block flex-1 max-w-md mx-4 lg:mx-0">
                        <form action="/clients" method="GET" class="relative group">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                                </svg>
                            </div>
                            <input type="text" name="q" placeholder="Rechercher un client..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-gray-50 focus:bg-white transition text-sm text-gray-700 shadow-sm placeholder-gray-400">
                        </form>
                    </div>

                    <div class="flex items-center gap-4 ml-auto">

                        <a href="/profil" class="flex items-center gap-2.5 bg-white border border-gray-200 px-3 py-1.5 rounded-full hover:border-blue-300 hover:bg-blue-50 hover:text-blue-700 transition-all shadow-sm group" title="Mon Espace Personnel">
                            <div class="bg-blue-100 text-blue-600 p-1 rounded-full group-hover:bg-blue-200 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                                    <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <span class="hidden sm:inline text-sm font-semibold text-gray-700 group-hover:text-blue-700 capitalize">
                                {{ session.get('username', 'Utilisateur') }}
                            </span>
                        </a>

                        <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

                        <a href="/logout" class="flex items-center gap-1 text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1.5 rounded-lg transition-colors text-sm font-medium">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 hidden sm:block">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                            </svg>
                            <span class="sm:hidden">Sortir</span>
                        </a>
                    </div>

                </div>
            </header>

            <main>
                <div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
                    {% block content %}
                    {% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script>
        function telechargerPDF(idDuTableau, nomDuFichier) {
            var element = document.getElementById(idDuTableau);
            var options = {
                margin: 0.5,
                filename: nomDuFichier,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(options).from(element).save();
        }
    </script>
</body>
</html>
